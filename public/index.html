<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OnProtec AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-box h2 { margin-bottom: 20px; color: #1a73e8; }
        .login-box input { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .login-box button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .login-box button:hover { background-color: #1557b0; }
        .error { color: red; margin-bottom: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>OnProtec AI</h2>
        <p>Inicia sesión en tu panel</p>
        <div id="errorMsg" class="error">Usuario o contraseña incorrectos</div>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script>
        // Si ya hay token, redirigir
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        if (token) {
            window.location.href = role === 'master' ? '/dashboard.html' : '/chat.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    if (data.tenantId) localStorage.setItem('tenantId', data.tenantId);
                    window.location.href = data.role === 'master' ? '/dashboard.html' : '/chat.html';
                } else {
                    const errEl = document.getElementById('errorMsg');
                    errEl.innerText = data.error || 'Error de autenticación';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
